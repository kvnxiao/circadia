[tool.ruff]
required-version = "==0.17.1"
target-version = "py315"
extend-exclude = ["**/target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ty.environment]
python-version = "3.15"
python-platform = "win32"

[tool.ty.src]
exclude = ["**/target"]

[tool.ty.rules]
all = "error"
