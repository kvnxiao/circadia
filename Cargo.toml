[package]
name = "circadia"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Schedule native Windows Night Light temperatures"
repository = "https://github.com/kvnxiao/circadia"

[features]
self-contained = ["dep:windows-reactor-setup"]
native-tests = ["windows/Win32_Foundation", "windows/Win32_System_Com", "windows/Win32_UI_Accessibility", "winsafe/ole"]
graph-measurement = ["native-tests", "windows-reactor/test"]

[[bin]]
name = "native-lifecycle"
path = "tools/native_lifecycle.rs"
required-features = ["native-tests"]

[dependencies]
fs-err = "3.3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
solar-positioning = { version = "0.7.1", default-features = false, features = ["std"] }
tempfile = "3"
thiserror = "2.0"
toml = "1.1"

[target.'cfg(windows)'.dependencies]
win-nightlight-lib = "0.5.0"
win-nightlight-watch = "0.5.0"
windows-result = "0.100.0"
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }
windows-future = "0.3"
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "722f202100c3bd428627941d3834d87ad6679d1c" }
windows-window = { git = "https://github.com/microsoft/windows-rs", rev = "722f202100c3bd428627941d3834d87ad6679d1c" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Time", "Win32_System_WindowsProgramming", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winsafe = { version = "0.0.29", features = ["user", "shell", "advapi"] }

[build-dependencies]
fs-err = "3.3"

[target.'cfg(windows)'.build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "722f202100c3bd428627941d3834d87ad6679d1c", optional = true }

[dev-dependencies]
test-case = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-core = "0.62"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
todo = "warn"
unimplemented = "warn"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "deny"
needless_pass_by_value = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
