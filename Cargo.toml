[workspace]
members = ["circadia-app", "circadia-bindings", "circadia-harness", "circadia-winsafe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kvnxiao/circadia"

[workspace.dependencies]
circadia-app = { path = "circadia-app", version = "0.1.0" }
circadia-winsafe = { path = "circadia-winsafe", version = "0.1.0" }
fs-err = "3.3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
toml = "1.1"
win-nightlight-lib = "0.5.0"
winsafe = { version = "0.0.29", features = ["user", "shell", "advapi", "gdi"] }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-bindgen = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-composition = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec", default-features = false }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-future = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-result = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-sys = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-time = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-version = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-window = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }

[patch.crates-io]
windows-result = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-registry = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-strings = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }
windows-link = { git = "https://github.com/microsoft/windows-rs", rev = "27abacf80e4d3e60de129d32c559b618faeb1fec" }

[profile.release]
debug = "line-tables-only"

[profile.testrelease]
inherits = "test"
debug-assertions = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
todo = "warn"
unimplemented = "warn"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "deny"
needless_pass_by_value = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
