[package]
name = "circadia-bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Windows composition bindings for Circadia and their generator"

[[bin]]
name = "circadia-bindings"
path = "src/main.rs"
required-features = ["generator"]

[features]
generator = ["dep:fs-err", "dep:tempfile", "dep:toml", "dep:windows-bindgen"]

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows-collections.workspace = true
windows-numerics.workspace = true
windows-time.workspace = true

[dependencies]
fs-err = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
windows-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
