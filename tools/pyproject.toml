[project]
name = "circadia-tools"
version = "0.1.0"
requires-python = ">=3.15"

[tool.uv]
package = false
required-version = ">=0.13"

[tool.ruff]
src = ["windows-clock", "solar-timing"]
extend-exclude = ["**/target"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001"]
extend-safe-fixes = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "D", "PLR2004", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-platform = "win32"
extra-paths = ["windows-clock", "solar-timing"]

[tool.ty.src]
exclude = ["**/target"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.pytest]
minversion = "9.0"
testpaths = ["windows-clock", "solar-timing"]
pythonpath = ["windows-clock", "solar-timing"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
