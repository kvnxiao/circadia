[package]
name = "circadia-settings-design-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# The shared generated projection is outside this package's source directory.
[package.metadata.cargo-machete]
ignored = ["windows-collections", "windows-numerics", "windows-time"]

[dependencies]
anyhow = "1"
fluent-pseudo = "0.3"
fs-err = "3"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
num-traits = "0.2"
png = "0.18"
rust-embed = "8"
windows-canvas = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b", features = ["composition", "reactor"] }
windows-composition = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b", default-features = false, features = ["reactor"] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b" }
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b" }
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b" }
windows-time = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b" }
windows-sys = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b", features = ["datetimeapi", "errhandlingapi", "minwinbase", "shellapi", "shlobj_core", "windef", "winerror", "wingdi", "winnls", "winuser"] }

[build-dependencies]
anyhow = "1"
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "3b6bea553787d9419b3fdd29e2c5436666d7325b", optional = true }

[dev-dependencies]
fluent-syntax = "0.12"
test-case = "3"

[features]
self-contained = ["dep:windows-reactor-setup"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
todo = "warn"
unimplemented = "warn"

let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"

mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"

float_cmp = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"

rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"

print_stdout = "deny"
print_stderr = "deny"
exit = "deny"

cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "deny"
needless_pass_by_value = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
