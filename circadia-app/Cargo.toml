[package]
name = "circadia-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Schedule native Windows Night light temperatures"
repository.workspace = true

[[bin]]
name = "circadia"
path = "src/main.rs"

[features]
self-contained = ["dep:windows-reactor-setup"]
graph-measurement = ["windows-reactor/test"]
output-measurement = []

[dependencies]
fluent-bundle = "0.16"
fluent-pseudo = "0.3"
fs-err.workspace = true
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
jiff.workspace = true
png.workspace = true
regex = "1.13"
rust-embed = { version = "8", features = ["debug-embed"] }
serde.workspace = true
semver = "1.0"
serde_json.workspace = true
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
solar-positioning = { version = "0.7.1", default-features = false, features = ["std"] }
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry"] }

[target.'cfg(windows)'.dependencies]
win-nightlight-lib.workspace = true
win-nightlight-watch = "0.5.0"
windows-result.workspace = true
windows = { workspace = true, features = ["Devices_Geolocation", "Foundation", "Security_Authorization_AppCapabilityAccess", "UI_ViewManagement"] }
windows-future.workspace = true
windows-core.workspace = true
windows-collections.workspace = true
windows-numerics.workspace = true
windows-time.workspace = true
windows-version.workspace = true
windows-canvas = { workspace = true, features = ["composition", "reactor"] }
windows-composition = { workspace = true, features = ["reactor"] }
windows-reactor.workspace = true
windows-window.workspace = true
windows-sys = { workspace = true, features = ["datetimeapi", "errhandlingapi", "minwinbase", "minwindef", "ntstatus", "powerbase", "processthreadsapi", "realtimeapiset", "shellapi", "shlobj_core", "stringapiset", "synchapi", "timezoneapi", "verrsrc", "winbase", "windef", "winerror", "winevt", "wingdi", "winnls", "winnt", "winuser", "winver", "wtsapi32"] }
winsafe.workspace = true

[build-dependencies]
embed-resource = "3.0.12"
fs-err.workspace = true
ico = "0.6"
resvg = { version = "0.49", default-features = false }

[target.'cfg(windows)'.build-dependencies]
windows-reactor-setup = { workspace = true, optional = true }

[dev-dependencies]
fluent-syntax = "0.12"
test-case = "3"

[lints]
workspace = true
