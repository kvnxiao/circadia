[package]
name = "circadia-winsafe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Safe wrappers for the Windows operations that Circadia calls without a safe dependency API"
repository.workspace = true

[features]
test-fixtures = ["dep:windows-core", "dep:windows-future"]

[target.'cfg(windows)'.dependencies]
windows-core = { workspace = true, optional = true }
windows-future = { workspace = true, optional = true }
windows-window.workspace = true
windows-result.workspace = true
windows-sys = { workspace = true, features = ["datetimeapi", "errhandlingapi", "minwinbase", "ntstatus", "powerbase", "realtimeapiset", "shlobj_core", "stringapiset", "synchapi", "timezoneapi", "verrsrc", "winbase", "windef", "winerror", "winevt", "winnls", "winnt", "winternl", "winuser", "winver", "wtsapi32"] }
win-nightlight-watch.workspace = true
winsafe.workspace = true

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
