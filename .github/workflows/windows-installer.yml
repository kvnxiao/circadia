name: Windows packaging

on:
  workflow_call:
    inputs:
      git-cache-key:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Unsigned x64 installer
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-bundle-licenses@4.2.0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-release
          cache-bin: false
          cache-directories: '!~/.cargo/git'
      - name: Restore shared Git sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ inputs.git-cache-key }}
      - name: Build unsigned installer
        run: just installer
      - name: Upload installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-unsigned
          path: |
            target/installer/*-setup.exe
            target/installer/*-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Archive matching debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-symbols
          path: target/x86_64-pc-windows-msvc/release/circadia.pdb
          if-no-files-found: error
          retention-days: 90
