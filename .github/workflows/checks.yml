name: Tests and code quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_PROFILE_TESTRELEASE_DEBUG: line-tables-only

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-scope.mjs

  formatting:
    name: Rust formatting and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: just fmt-check
      - name: Test workflow selection
        run: node --test .github/scripts/check-scope.test.mjs
      - name: Check workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: '1.7.12'
          pyflakes: false
      - name: Check installer shell script
        run: shellcheck packaging/build-installer.sh

  cargo-git:
    name: Cargo Git sources
    needs: changes
    env:
      RUN_CHECKS: ${{ needs.changes.outputs.application }}
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Report check scope
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$RUN_CHECKS" == true ]]; then
            echo "Affected files require these checks."
          else
            echo "No affected files; checks pass without rebuilding."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_CHECKS == 'true'
        with:
          persist-credentials: false
      - name: Compute Git source cache key
        if: env.RUN_CHECKS == 'true'
        id: key
        run: |
          sources=$(sed -n '/^source = "git+/p' Cargo.lock | tr -d '\r' | LC_ALL=C sort -u | sha256sum)
          echo "value=cargo-git-v1-Windows-${sources%% *}" >> "$GITHUB_OUTPUT"
      - name: Look up shared Git sources
        if: env.RUN_CHECKS == 'true'
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Install stable Rust
        if: env.RUN_CHECKS == 'true' && (steps.sources.outputs.cache-hit != 'true')
        run: rustup toolchain install stable --profile minimal
      - name: Fetch locked dependencies
        if: env.RUN_CHECKS == 'true' && (steps.sources.outputs.cache-hit != 'true')
        run: cargo +stable fetch --locked --target x86_64-pc-windows-msvc
      - name: Save shared Git sources before checks
        if: env.RUN_CHECKS == 'true' && (steps.sources.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}

  rust:
    name: ${{ matrix.name }}
    needs: [changes, cargo-git]
    env:
      RUN_CHECKS: ${{ needs.changes.outputs[matrix.scope] }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Application tests
            project: .
            recipes: test test-release-text
            scope: application
            cache: application-tests
          - name: Application lint, docs, and bindings
            project: .
            recipes: clippy doc check-composition-bindings
            scope: application
            cache: application-checks
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: Report check scope
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$RUN_CHECKS" == true ]]; then
            echo "Affected files require these checks."
          else
            echo "No affected files; checks pass without rebuilding."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_CHECKS == 'true'
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: env.RUN_CHECKS == 'true'
        with:
          tool: just
      - name: Install stable Rust
        if: env.RUN_CHECKS == 'true'
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install binding generator formatter
        if: env.RUN_CHECKS == 'true' && (matrix.cache == 'application-checks')
        run: rustup component add rustfmt --toolchain stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUN_CHECKS == 'true'
        with:
          key: ${{ matrix.cache }}
          workspaces: ${{ matrix.project }} -> target
          cache-bin: false
          cache-directories: '!~/.cargo/git'
      - name: Restore shared Git sources
        if: env.RUN_CHECKS == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ needs.cargo-git.outputs.cache-key }}
      - name: Run checks
        if: env.RUN_CHECKS == 'true'
        env:
          CHECK_RECIPES: ${{ matrix.recipes }}
        run: |
          read -r -a recipes <<< "$CHECK_RECIPES"
          just "${recipes[@]}"

  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-audit,cargo-machete
      - run: just dependencies

  required:
    name: All required checks
    if: always()
    needs: [changes, formatting, cargo-git, rust, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
