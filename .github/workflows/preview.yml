name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CIRCADIA_CHANNEL: preview
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-bundle-licenses@4.2.0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Compute Git source cache key
        id: key
        run: |
          sources=$(sed -n '/^source = "git+/p' Cargo.lock | tr -d '\r' | LC_ALL=C sort -u | sha256sum)
          echo "value=cargo-git-v1-Windows-${sources%% *}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-release
          cache-bin: false
          cache-directories: '!~/.cargo/git'
      - name: Restore shared Git sources
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}
      - name: Fetch locked dependencies
        if: steps.sources.outputs.cache-hit != 'true'
        run: cargo +stable fetch --locked --target x86_64-pc-windows-msvc
      - name: Save shared Git sources
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}
      - name: Build Windows x64 installer
        id: build
        run: just installer
      - name: Upload installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-unsigned-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.installer }}
            ${{ steps.build.outputs.installer }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Archive matching debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-symbols
          path: target/x86_64-pc-windows-msvc/release/circadia.pdb
          if-no-files-found: error
          retention-days: 90
