name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  formatting:
    name: Rust formatting and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: |
          just fmt-check
          just --justfile tools/solar-calculation/justfile fmt-check
          just --justfile tools/windows-reactor/justfile fmt-check
          just --justfile tools/windows-reactor/settings-design/justfile fmt-check
          rustfmt +nightly --check --edition 2024 tools/solar-timing/solar-timing.rs
      - name: Check workflows
        run: actionlint -color
      - name: Check installer shell script
        run: shellcheck packaging/build-installer.sh

  cargo-git:
    name: Prepare Cargo Git sources
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute Git source cache key
        id: key
        run: |
          sources=$(sed -n '/^source = "git+/p' Cargo.lock tools/windows-reactor/Cargo.lock tools/windows-reactor/settings-design/Cargo.lock | tr -d '\r' | LC_ALL=C sort -u | sha256sum)
          echo "value=cargo-git-v1-Windows-${sources%% *}" >> "$GITHUB_OUTPUT"
      - name: Look up shared Git sources
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Install stable Rust
        if: steps.sources.outputs.cache-hit != 'true'
        run: rustup toolchain install stable --profile minimal
      - name: Fetch locked dependencies
        if: steps.sources.outputs.cache-hit != 'true'
        run: |
          for manifest in Cargo.toml tools/windows-reactor/Cargo.toml tools/windows-reactor/settings-design/Cargo.toml; do
            cargo +stable fetch --locked --manifest-path "$manifest" --target x86_64-pc-windows-msvc
          done
      - name: Save shared Git sources before checks
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ steps.key.outputs.value }}

  rust:
    name: ${{ matrix.name }}
    needs: cargo-git
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Application unit tests
            project: .
            recipes: test test-release-text
            cache: application-tests
          - name: Application Clippy, docs, and bindings
            project: .
            recipes: clippy doc check-composition-bindings
            cache: application-checks
          - name: Solar probe checks
            project: tools/solar-calculation
            recipes: clippy test doc
            cache: solar
          - name: Reactor probe checks
            project: tools/windows-reactor
            recipes: clippy test doc
            cache: reactor
          - name: Settings probe checks
            project: tools/windows-reactor/settings-design
            recipes: clippy test doc
            cache: settings
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install binding generator formatter
        if: matrix.cache == 'application-checks'
        run: rustup component add rustfmt --toolchain stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: compiled
        with:
          key: ${{ matrix.cache }}
          workspaces: ${{ matrix.project }} -> target
          cache-bin: false
      - name: Restore shared Git sources
        if: matrix.cache != 'solar' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ needs.cargo-git.outputs.cache-key }}
      - name: Run checks
        env:
          CHECK_RECIPES: ${{ matrix.recipes }}
        run: |
          read -r -a recipes <<< "$CHECK_RECIPES"
          just "${recipes[@]}"
      - name: Compile and lint the solar timing binary
        if: matrix.cache == 'solar'
        run: |
          timing_project=$(mktemp -d)
          cp -R src fixtures.json Cargo.toml Cargo.lock rust-toolchain.toml rustfmt.toml clippy.toml justfile "$timing_project/"
          cp ../solar-timing/solar-timing.rs "$timing_project/src/bin/"
          cat ../solar-timing/timing.just >> "$timing_project/justfile"
          just --justfile "$timing_project/justfile" clippy timing-build

  python:
    name: Python tools lint, types, formatting, and unit tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: tools/pyproject.toml
          python-version: '3.15'
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: just --justfile tools/justfile check

  dependencies:
    name: Rust dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-audit,cargo-machete
      - run: |
          just dependencies
          just --justfile tools/solar-calculation/justfile dependencies
          just --justfile tools/windows-reactor/justfile dependencies
          just --justfile tools/windows-reactor/settings-design/justfile dependencies

  installer:
    name: Unsigned Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [formatting, cargo-git, rust, python, dependencies]
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just,cargo-bundle-licenses@4.2.0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: compiled
        with:
          key: installer-release
          cache-bin: false
      - name: Restore shared Git sources
        if: steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ needs.cargo-git.outputs.cache-key }}
      - name: Build unsigned installer
        run: just installer
      - name: Upload installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-unsigned
          path: |
            target/installer/*-setup.exe
            target/installer/*-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Archive matching debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Circadia-windows-x64-symbols
          path: target/x86_64-pc-windows-msvc/release/circadia.pdb
          if-no-files-found: error
          retention-days: 90
